<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>浮世繪・雪景古寺與朱紅太鼓橋</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5efe6;
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      color: #1c3144;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* 載入遮罩 */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #f7f1e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .seal-loader {
      width: 54px;
      height: 54px;
      border: 3px solid #c9463d;
      color: #c9463d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      background: rgba(255, 250, 245, 0.92);
      box-shadow: 0 4px 12px rgba(201, 70, 61, 0.18);
      animation: pulseSeal 1.2s infinite ease-in-out;
    }
    @keyframes pulseSeal {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    #loading-text {
      font-size: 13.5px;
      color: #2c4a66;
      letter-spacing: 1.5px;
    }

    /* 和紙雙線邊框裝飾 */
    .washi-frame {
      position: fixed;
      inset: 8px;
      border: 1.5px solid rgba(36, 62, 86, 0.35);
      pointer-events: none;
      z-index: 10;
    }
    .washi-frame::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 0.5px solid rgba(36, 62, 86, 0.18);
    }

    /* 左上落款印章 */
    .title-seal {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      background: rgba(250, 245, 238, 0.92);
      border: 2px solid #c9463d;
      padding: 8px 6px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #c9463d;
      box-shadow: 0 3px 10px rgba(28, 49, 68, 0.12);
      pointer-events: none;
    }

    /* 頂部標題膠囊 */
    .header-pill {
      position: fixed;
      top: 16px;
      left: 58px;
      right: 118px;
      max-width: 340px;
      z-index: 20;
      background: rgba(250, 245, 238, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(36, 62, 86, 0.25);
      border-radius: 999px;
      padding: 7px 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #1f3952;
      box-shadow: 0 3px 12px rgba(28, 49, 68, 0.1);
      pointer-events: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c9463d;
      flex-shrink: 0;
    }
    .header-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 右上控制切換鈕 */
    #toggle-panel-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(250, 245, 238, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(36, 62, 86, 0.35);
      border-radius: 999px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #1f3952;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 12px rgba(28, 49, 68, 0.14);
      transition: transform 0.15s ease;
    }
    #toggle-panel-btn:active {
      transform: scale(0.96);
    }

    /* 控制面板 */
    #control-panel {
      position: fixed;
      top: 58px;
      right: 16px;
      width: 266px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      z-index: 25;
      background: rgba(250, 245, 238, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(36, 62, 86, 0.28);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(20, 38, 56, 0.16);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
    }
    #control-panel.collapsed {
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
      visibility: hidden;
      pointer-events: none;
    }
    .panel-section {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(36, 62, 86, 0.2);
    }
    .panel-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #274866;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-grid.cols-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }
    .ui-btn {
      background: #ffffff;
      border: 1px solid rgba(36, 62, 86, 0.25);
      border-radius: 8px;
      padding: 7px 5px;
      font-family: inherit;
      font-size: 12px;
      color: #1f3952;
      cursor: pointer;
      text-align: center;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .ui-btn.active {
      background: #23476a;
      color: #fffaf2;
      border-color: #23476a;
      font-weight: 600;
    }
    .slider-row {
      margin-bottom: 9px;
    }
    .slider-row:last-child {
      margin-bottom: 0;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #2c4a66;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #c9463d;
      height: 5px;
      cursor: pointer;
    }

    /* 底部操作提示 */
    .bottom-hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(250, 245, 238, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(36, 62, 86, 0.2);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      color: #2c4a66;
      white-space: nowrap;
      max-width: calc(100vw - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="seal-loader">雪寺</div>
    <div id="loading-text">正在摺刷浮世繪木版畫卷…</div>
  </div>

  <div id="canvas-container"></div>
  <div class="washi-frame"></div>

  <div class="title-seal">雪景古寺</div>

  <div class="header-pill">
    <span class="header-dot"></span>
    <span class="header-title-text">浮世繪・雪化粧の朱寺と太鼓橋</span>
  </div>

  <button id="toggle-panel-btn" type="button">
    <span>⛩️</span>
    <span>畫卷控制</span>
  </button>

  <div id="control-panel">
    <div class="panel-section">
      <div class="section-label"><span>取景視角</span></div>
      <div class="btn-grid">
        <button class="ui-btn active" data-cam="default">浮世繪原畫</button>
        <button class="ui-btn" data-cam="temple">朱紅古寺特寫</button>
        <button class="ui-btn" data-cam="bridge">雪溪朱橋近景</button>
        <button class="ui-btn" data-cam="orbit">自動環繞巡覽</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label"><span>木版摺刷色調</span></div>
      <div class="btn-grid cols-3">
        <button class="ui-btn active" data-palette="classic">原畫藍朱</button>
        <button class="ui-btn" data-palette="aizuri">藍摺繪風</button>
        <button class="ui-btn" data-palette="twilight">暮雪霞光</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="slider-row">
        <div class="slider-header">
          <span>木版墨線粗細</span>
          <span id="val-outline">1.0x</span>
        </div>
        <input id="slider-outline" type="range" min="0.4" max="2.0" step="0.1" value="1.0" />
      </div>
      <div class="slider-row">
        <div class="slider-header">
          <span>飛雪飄落密度</span>
          <span id="val-snow">65%</span>
        </div>
        <input id="slider-snow" type="range" min="0" max="100" step="5" value="65" />
      </div>
      <div class="slider-row">
        <div class="slider-header">
          <span>溪流水紋流速</span>
          <span id="val-water">1.0x</span>
        </div>
        <input id="slider-water" type="range" min="0" max="2.5" step="0.1" value="1.0" />
      </div>
    </div>
  </div>

  <div class="bottom-hint">單指／左鍵：環繞欣賞 ｜ 雙指／滾輪：縮放遠近 ｜ 雙指平移／右鍵：移動</div>

  <script>
    (function () {
      // 高速雙 CDN 備援載入（優先 jsdelivr，3 秒超時自動切換 cdnjs）
      const CDN_URLS = [
        "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
      ];

      function loadThree(idx) {
        if (window.THREE) {
          requestAnimationFrame(initApp);
          return;
        }
        if (idx >= CDN_URLS.length) {
          document.getElementById("loading-text").textContent = "無法載入 3D 引擎，請檢查網路連線後重新整理";
          return;
        }
        const script = document.createElement("script");
        script.src = CDN_URLS[idx];
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            script.remove();
            loadThree(idx + 1);
          }
        }, 3000);

        script.onload = () => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            requestAnimationFrame(initApp);
          }
        };
        script.onerror = () => {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            script.remove();
            loadThree(idx + 1);
          }
        };
        document.head.appendChild(script);
      }

      loadThree(0);

      function initApp() {
        const THREE = window.THREE;
        const container = document.getElementById("canvas-container");

        // 手機螢幕或 ?ui=0 預設收合面板，保持畫面通透
        const params = new URLSearchParams(window.location.search);
        const panel = document.getElementById("control-panel");
        const toggleBtn = document.getElementById("toggle-panel-btn");
        if (params.get("ui") === "0" || window.innerWidth < 680) {
          panel.classList.add("collapsed");
        }
        toggleBtn.addEventListener("click", () => {
          panel.classList.toggle("collapsed");
        });

        // 高效能 WebGL 渲染器設定（限制最大像素比為 1.75，避免高解析手機過熱卡頓）
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance",
          stencil: false
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf7f2ea);
        scene.fog = new THREE.FogExp2(0xf7f2ea, 0.012);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);

        // 全域浮世繪著色器 Uniforms
        const globalUniforms = {
          uTime: { value: 0 },
          uLightDir: { value: new THREE.Vector3(-0.55, 0.85, 0.65).normalize() },
          uOutlineWidth: { value: 0.044 },
          uInkColor: { value: new THREE.Color(0x1b3b5a) },
          uSnowColor: { value: new THREE.Color(0xfcfdff) },
          uSnowShadow: { value: new THREE.Color(0xc5d8ea) },
          uWaterDeep: { value: new THREE.Color(0x164166) },
          uWaterLight: { value: new THREE.Color(0x3f7ca6) },
          uWaterSpeed: { value: 1.0 },
          uVermilionBoost: { value: 1.0 }
        };

        // 浮世繪三段式平塗 + 木版摺刷木紋著色器工廠
        function createUkiyoeMaterial(options) {
          const {
            baseColor = 0xc9463d,
            shadowColor = 0x7d2322,
            highlightColor = 0xe86c5d,
            snowCover = 0.0,
            woodGrain = 0.0,
            isVermilion = false
          } = options || {};

          return new THREE.ShaderMaterial({
            uniforms: {
              uBaseColor: { value: new THREE.Color(baseColor) },
              uShadowColor: { value: new THREE.Color(shadowColor) },
              uHighlightColor: { value: new THREE.Color(highlightColor) },
              uSnowCover: { value: snowCover },
              uWoodGrain: { value: woodGrain },
              uIsVermilion: { value: isVermilion ? 1.0 : 0.0 },
              uLightDir: globalUniforms.uLightDir,
              uSnowColor: globalUniforms.uSnowColor,
              uSnowShadow: globalUniforms.uSnowShadow,
              uVermilionBoost: globalUniforms.uVermilionBoost
            },
            vertexShader: `
              varying vec3 vNormal;
              varying vec3 vWorldPos;
              void main() {
                vNormal = normalize(mat3(modelMatrix) * normal);
                vec4 wp = modelMatrix * vec4(position, 1.0);
                vWorldPos = wp.xyz;
                gl_Position = projectionMatrix * viewMatrix * wp;
              }
            `,
            fragmentShader: `
              uniform vec3 uBaseColor;
              uniform vec3 uShadowColor;
              uniform vec3 uHighlightColor;
              uniform float uSnowCover;
              uniform float uWoodGrain;
              uniform float uIsVermilion;
              uniform vec3 uLightDir;
              uniform vec3 uSnowColor;
              uniform vec3 uSnowShadow;
              uniform float uVermilionBoost;

              varying vec3 vNormal;
              varying vec3 vWorldPos;

              float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
              }
              float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                return mix(
                  mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                  mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
                  f.y
                );
              }

              void main() {
                vec3 n = normalize(vNormal);
                float ndotl = dot(n, normalize(uLightDir));

                vec3 col = uBaseColor;
                if (ndotl < -0.05) {
                  col = uShadowColor;
                } else if (ndotl > 0.42) {
                  col = uHighlightColor;
                }

                if (uIsVermilion > 0.5) {
                  vec3 aizuriBlue = vec3(0.18, 0.36, 0.54);
                  col = mix(aizuriBlue, col, uVermilionBoost);
                }

                if (uWoodGrain > 0.01) {
                  float grain = noise(vec2(vWorldPos.x * 16.0, vWorldPos.y * 2.5 + vWorldPos.z * 16.0));
                  col *= (1.0 - uWoodGrain * 0.14 * (1.0 - grain));
                }

                if (uSnowCover > 0.01) {
                  float nVal = noise(vWorldPos.xz * 1.4);
                  float upMask = smoothstep(0.32 - uSnowCover * 0.25, 0.62 - uSnowCover * 0.2, n.y + (nVal - 0.5) * 0.22);
                  if (upMask > 0.05) {
                    vec3 snowCol = ndotl < 0.05 ? uSnowShadow : uSnowColor;
                    col = mix(col, snowCol, upMask);
                  }
                }

                float paper = hash(floor(gl_FragCoord.xy * 0.75)) * 0.028;
                col += vec3(paper - 0.012);

                gl_FragColor = vec4(col, 1.0);
              }
            `
          });
        }

        // 主體反轉法線木版墨線描邊材質（僅用於大型結構輪廓，細部不重複生成描邊以確保清晰與高效能）
        const outlineMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uOutlineWidth: globalUniforms.uOutlineWidth,
            uInkColor: globalUniforms.uInkColor
          },
          side: THREE.BackSide,
          vertexShader: `
            uniform float uOutlineWidth;
            void main() {
              vec3 pos = position + normal * uOutlineWidth;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 uInkColor;
            void main() {
              gl_FragColor = vec4(uInkColor, 1.0);
            }
          `
        });

        // withOutline = true 僅用於主體輪廓；細部構件設為 false，兼具極致清晰度與高效能
        function addMesh(parent, geometry, material, withOutline = false) {
          const mesh = new THREE.Mesh(geometry, material);
          parent.add(mesh);
          if (withOutline) {
            mesh.add(new THREE.Mesh(geometry, outlineMaterial));
          }
          return mesh;
        }

        // 共用浮世繪材質集
        const matVermilion = createUkiyoeMaterial({
          baseColor: 0xd4493d,
          shadowColor: 0x872322,
          highlightColor: 0xf06e5d,
          woodGrain: 0.85,
          isVermilion: true
        });
        const matDarkRed = createUkiyoeMaterial({
          baseColor: 0xa12e29,
          shadowColor: 0x5e1618,
          highlightColor: 0xc4453d,
          woodGrain: 0.85,
          isVermilion: true
        });
        const matArchIndigo = createUkiyoeMaterial({
          baseColor: 0x224c73,
          shadowColor: 0x112940,
          highlightColor: 0x396e9e,
          woodGrain: 0.75
        });
        const matGold = createUkiyoeMaterial({
          baseColor: 0xdfa943,
          shadowColor: 0x94681a,
          highlightColor: 0xf7cf72
        });
        const matSnow = createUkiyoeMaterial({
          baseColor: 0xfafcff,
          shadowColor: 0xc5d9ec,
          highlightColor: 0xffffff
        });
        const matSnowRock = createUkiyoeMaterial({
          baseColor: 0x6285a6,
          shadowColor: 0x345370,
          highlightColor: 0x89aac9,
          snowCover: 0.78,
          woodGrain: 0.5
        });
        const matStone = createUkiyoeMaterial({
          baseColor: 0x889fb5,
          shadowColor: 0x4e6780,
          highlightColor: 0xb5c9db,
          snowCover: 0.42
        });
        const matFoliage = createUkiyoeMaterial({
          baseColor: 0x325d82,
          shadowColor: 0x193652,
          highlightColor: 0x5384ad,
          snowCover: 0.85
        });
        const matTrunk = createUkiyoeMaterial({
          baseColor: 0x2c4257,
          shadowColor: 0x162433,
          highlightColor: 0x46637d,
          woodGrain: 1.0
        });
        const matShoji = createUkiyoeMaterial({
          baseColor: 0xfaf2e6,
          shadowColor: 0xdccfb9,
          highlightColor: 0xfffcf5
        });

        // ==========================================
        // 1. 流動靛青溪流與覆雪藍灰山岩地形
        // ==========================================
        const terrainGroup = new THREE.Group();
        scene.add(terrainGroup);

        const waterMat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: globalUniforms.uTime,
            uWaterDeep: globalUniforms.uWaterDeep,
            uWaterLight: globalUniforms.uWaterLight,
            uWaterSpeed: globalUniforms.uWaterSpeed,
            uInkColor: globalUniforms.uInkColor
          },
          vertexShader: `
            varying vec3 vWorldPos;
            void main() {
              vec4 wp = modelMatrix * vec4(position, 1.0);
              vWorldPos = wp.xyz;
              gl_Position = projectionMatrix * viewMatrix * wp;
            }
          `,
          fragmentShader: `
            uniform float uTime;
            uniform vec3 uWaterDeep;
            uniform vec3 uWaterLight;
            uniform float uWaterSpeed;
            uniform vec3 uInkColor;
            varying vec3 vWorldPos;

            void main() {
              float t = uTime * uWaterSpeed;
              vec2 uv = vWorldPos.xz;

              float wave1 = sin(uv.x * 1.6 + sin(uv.y * 1.2 + t * 1.4) * 1.8 - t * 1.8);
              float wave2 = sin(uv.y * 5.5 + sin(uv.x * 2.2 - t * 1.1) * 1.5);
              float ripple = smoothstep(0.72, 0.92, wave1 * 0.55 + wave2 * 0.45);

              vec3 col = mix(uWaterDeep, uWaterLight, ripple * 0.65);

              float foam = smoothstep(0.88, 0.97, sin(uv.y * 9.0 + uv.x * 2.0 - t * 2.0));
              col = mix(col, vec3(0.92, 0.96, 1.0), foam * 0.55);

              float dx = (uv.x + 3.8) / 4.8;
              float dz = (uv.y - 2.6) / 2.2;
              float bridgeReflect = exp(-(dx * dx * 1.4 + dz * dz * 1.8));
              vec3 reflectTint = mix(vec3(0.65, 0.22, 0.22), uInkColor, 0.55);
              col = mix(col, reflectTint, bridgeReflect * 0.32 * (0.6 + 0.4 * sin(uv.y * 12.0 + t * 3.0)));

              gl_FragColor = vec4(col, 1.0);
            }
          `
        });

        const waterGeo = new THREE.PlaneGeometry(60, 60, 1, 1);
        waterGeo.rotateX(-Math.PI / 2);
        const waterMesh = new THREE.Mesh(waterGeo, waterMat);
        waterMesh.position.y = -0.35;
        terrainGroup.add(waterMesh);

        function createSculptedHill(rx, ry, rz, px, py, pz, mat) {
          const geo = new THREE.DodecahedronGeometry(1, 2);
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let y = pos.getY(i);
            let z = pos.getZ(i);
            const n = Math.sin(x * 3.1 + z * 2.4) * 0.14 + Math.cos(y * 4.0 + x * 2.0) * 0.1;
            if (y > 0.25) y = 0.25 + (y - 0.25) * 0.45;
            pos.setXYZ(i, x * rx * (1 + n), y * ry * (1 + n * 0.6), z * rz * (1 + n));
          }
          geo.computeVertexNormals();
          const m = addMesh(terrainGroup, geo, mat, true);
          m.position.set(px, py, pz);
          return m;
        }

        // 右側寺院岩台山丘
        createSculptedHill(8.6, 5.2, 7.8, 5.0, 2.0, -3.2, matSnowRock);
        createSculptedHill(6.0, 3.5, 5.6, 4.3, 1.0, 1.4, matSnowRock);
        // 右側橋頭連接岸坡
        createSculptedHill(3.6, 1.6, 3.4, 2.6, -0.35, 2.6, matSnowRock);
        // 左側橋頭連接岸坡
        createSculptedHill(4.4, 2.2, 4.5, -10.2, -0.1, 2.2, matSnowRock);
        createSculptedHill(5.0, 3.2, 5.2, -11.5, 0.8, -2.5, matSnowRock);

        const rockCoords = [
          [-9.5, -0.25, 5.6, 1.3, 0.85, 1.1],
          [-7.2, -0.35, 6.4, 0.9, 0.55, 0.8],
          [1.8, -0.25, 5.2, 1.4, 0.95, 1.2],
          [4.2, -0.2, 6.1, 1.6, 1.0, 1.3],
          [-2.2, -0.35, -1.6, 1.2, 0.75, 1.0],
          [0.5, -0.25, -2.2, 1.5, 1.05, 1.2],
          [7.4, -0.15, 4.8, 1.8, 1.2, 1.5]
        ];
        rockCoords.forEach(([x, y, z, sx, sy, sz]) => {
          const g = new THREE.DodecahedronGeometry(1, 1);
          const p = g.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
            const f = 1 + 0.16 * Math.sin(vx * 5 + vz * 4);
            p.setXYZ(i, vx * sx * f, vy * sy * f, vz * sz * f);
          }
          g.computeVertexNormals();
          const rock = addMesh(terrainGroup, g, matSnowRock, true);
          rock.position.set(x, y, z);
        });

        // ==========================================
        // 2. 朱紅太鼓拱橋（精準貼合三層高欄與擬寶珠 + 橋面薄雪）
        // ==========================================
        const bridgeGroup = new THREE.Group();
        bridgeGroup.position.set(-3.8, 0.16, 2.75);
        bridgeGroup.rotation.y = -0.12;
        bridgeGroup.scale.setScalar(1.06);
        scene.add(bridgeGroup);

        const BRIDGE_SPAN = 9.4;
        const BRIDGE_WIDTH = 2.58;
        const ARCH_RISE = 1.98;

        function getBridgeDeckY(x) {
          const t = Math.max(-1, Math.min(1, x / (BRIDGE_SPAN * 0.5)));
          return ARCH_RISE * Math.cos(t * Math.PI * 0.5);
        }

        function getBridgeSlopeAngle(x) {
          const dx = 0.02;
          const dy = getBridgeDeckY(x + dx) - getBridgeDeckY(x - dx);
          return Math.atan2(dy, 2 * dx);
        }

        function buildBridgeRibbonGeo(halfW, yOffsetFn, segs = 40) {
          const positions = [];
          const indices = [];

          for (let i = 0; i <= segs; i++) {
            const u = i / segs;
            const x = (u - 0.5) * BRIDGE_SPAN;
            const baseY = getBridgeDeckY(x);
            const yTop = baseY + yOffsetFn(x, true);
            const yBot = baseY + yOffsetFn(x, false);

            positions.push(
              x, yTop, -halfW,
              x, yTop,  halfW,
              x, yBot, -halfW,
              x, yBot,  halfW
            );
          }

          for (let i = 0; i < segs; i++) {
            const a = i * 4;
            const b = (i + 1) * 4;
            indices.push(a + 0, a + 1, b + 0, a + 1, b + 1, b + 0);
            indices.push(a + 2, b + 2, a + 3, a + 3, b + 2, b + 3);
            indices.push(a + 1, a + 3, b + 1, a + 3, b + 3, b + 1);
            indices.push(a + 0, b + 0, a + 2, a + 2, b + 0, b + 2);
          }
          indices.push(0, 2, 1, 1, 2, 3);
          const last = segs * 4;
          indices.push(last + 0, last + 1, last + 2, last + 1, last + 3, last + 2);

          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
          geo.setIndex(indices);
          geo.computeVertexNormals();
          return geo;
        }

        // 朱紅木橋板（保留主體墨線描邊）
        const deckGeo = buildBridgeRibbonGeo(BRIDGE_WIDTH * 0.5, (x, isTop) => (isTop ? 0.06 : -0.16), 44);
        addMesh(bridgeGroup, deckGeo, matVermilion, true);

        // 橋面中央薄薄一層積雪
        const bridgeSnowGeo = buildBridgeRibbonGeo(BRIDGE_WIDTH * 0.35, (x, isTop) => {
          const edgeTaper = Math.cos((x / (BRIDGE_SPAN * 0.5)) * Math.PI * 0.5);
          return isTop ? (0.06 + 0.032 * edgeTaper) : 0.055;
        }, 40);
        addMesh(bridgeGroup, bridgeSnowGeo, matSnow, false);

        // 橋腹雙層深靛青弧形主拱樑
        [-1, 1].forEach((side) => {
          const zCenter = side * (BRIDGE_WIDTH * 0.42);
          const mainRibGeo = buildBridgeRibbonGeo(0.14, (x, isTop) => {
            const archDrop = 0.22 * Math.sin((x / (BRIDGE_SPAN * 0.5)) * Math.PI * 0.5);
            return isTop ? -0.14 : (-0.46 - Math.abs(archDrop) * 0.15);
          }, 40);
          mainRibGeo.translate(0, 0, zCenter);
          addMesh(bridgeGroup, mainRibGeo, matArchIndigo, true);

          const subRibGeo = buildBridgeRibbonGeo(0.11, (x, isTop) => {
            const normX = x / (BRIDGE_SPAN * 0.5);
            const extraCurve = -0.32 * (1.0 - normX * normX);
            return isTop ? (-0.42 + extraCurve) : (-0.64 + extraCurve);
          }, 40);
          subRibGeo.translate(0, 0, zCenter * 0.96);
          addMesh(bridgeGroup, subRibGeo, matArchIndigo, false);
        });

        for (let i = -4; i <= 4; i++) {
          const bx = i * 0.95;
          const by = getBridgeDeckY(bx) - 0.32;
          const crossBeam = new THREE.BoxGeometry(0.18, 0.2, BRIDGE_WIDTH * 0.92);
          const m = addMesh(bridgeGroup, crossBeam, matArchIndigo, false);
          m.position.set(bx, by, 0);
          m.rotation.z = getBridgeSlopeAngle(bx);
        }

        // 左右兩側精準貼合橋緣的三層朱紅高欄與金色擬寶珠
        const RAIL_Z_OFFSET = BRIDGE_WIDTH * 0.5 - 0.14;
        const RAIL_HEIGHT = 0.88;
        const RAIL_LEVELS = [0.16, 0.50, 0.86];

        // 共用基礎幾何體以節省記憶體
        const sharedPostMajor = new THREE.BoxGeometry(0.16, RAIL_HEIGHT + 0.16, 0.16);
        const sharedPostMinor = new THREE.BoxGeometry(0.11, RAIL_HEIGHT + 0.04, 0.11);
        const sharedOrbBase = new THREE.CylinderGeometry(0.08, 0.09, 0.05, 10);
        const sharedOrbBulb = new THREE.SphereGeometry(0.08, 10, 8);
        const sharedOrbTip = new THREE.ConeGeometry(0.045, 0.09, 8);

        [-1, 1].forEach((side) => {
          const zRail = side * RAIL_Z_OFFSET;

          RAIL_LEVELS.forEach((hLevel, idx) => {
            const barHalfW = idx === 2 ? 0.085 : 0.065;
            const barThick = idx === 2 ? 0.09 : 0.07;
            const railBarGeo = buildBridgeRibbonGeo(
              barHalfW,
              (x, isTop) => hLevel + (isTop ? barThick * 0.5 : -barThick * 0.5),
              44
            );
            railBarGeo.translate(0, 0, zRail);
            addMesh(bridgeGroup, railBarGeo, idx === 1 ? matDarkRed : matVermilion, false);
          });

          const postCount = 11;
          for (let i = 0; i < postCount; i++) {
            const t = i / (postCount - 1);
            const px = (t - 0.5) * (BRIDGE_SPAN - 0.36);
            const deckY = getBridgeDeckY(px);
            const isEndPost = (i === 0 || i === postCount - 1);
            const postH = isEndPost ? RAIL_HEIGHT + 0.16 : RAIL_HEIGHT + 0.04;

            const postMesh = addMesh(bridgeGroup, isEndPost ? sharedPostMajor : sharedPostMinor, matVermilion, false);
            postMesh.position.set(px, deckY + postH * 0.5 - 0.02, zRail);

            const isGoldOrb = isEndPost || i === Math.floor(postCount / 2);
            const orbMat = isGoldOrb ? matGold : matVermilion;
            const baseY = deckY + postH + 0.04;

            const bMesh = addMesh(bridgeGroup, sharedOrbBase, isGoldOrb ? matGold : matDarkRed, false);
            bMesh.position.set(px, baseY, zRail);

            const bulbMesh = addMesh(bridgeGroup, sharedOrbBulb, orbMat, false);
            bulbMesh.scale.set(1, 1.25, 1);
            bulbMesh.position.set(px, baseY + 0.07, zRail);

            const tipMesh = addMesh(bridgeGroup, sharedOrbTip, orbMat, false);
            tipMesh.position.set(px, baseY + 0.16, zRail);
          }
        });

        // 橋頭兩端石階引道
        const stepGeo = new THREE.BoxGeometry(0.38, 0.16, BRIDGE_WIDTH * 0.96);
        [-1, 1].forEach((endDir) => {
          for (let s = 0; s < 4; s++) {
            const sx = endDir * (BRIDGE_SPAN * 0.5 + 0.15 + s * 0.32);
            const sy = -0.05 - s * 0.11;
            const stepMesh = addMesh(bridgeGroup, stepGeo, matStone, false);
            stepMesh.position.set(sx, sy, 0);
          }
        });

        // ==========================================
        // 3. 朱紅古寺（核心焦點：輕薄入母屋瓦坡 + 極薄一層雪 + 清晰障子窗櫺與唐破風）
        // ==========================================
        const templeGroup = new THREE.Group();
        templeGroup.position.set(4.55, 3.62, -2.55);
        templeGroup.rotation.y = -0.46; // 斜向 45 度立面展示
        templeGroup.scale.setScalar(1.14);
        scene.add(templeGroup);

        // (A) 石造基壇與下山石階
        const podiumBase = addMesh(templeGroup, new THREE.BoxGeometry(7.0, 0.85, 5.8), matStone, true);
        podiumBase.position.set(0, -0.42, 0);

        const podiumSnow = addMesh(templeGroup, new THREE.BoxGeometry(7.02, 0.05, 5.82), matSnow, false);
        podiumSnow.position.set(0, 0.02, 0);

        const stairGeo = new THREE.BoxGeometry(1.85, 0.18, 0.36);
        const stairSnowGeo = new THREE.BoxGeometry(0.32, 0.035, 0.34);
        for (let s = 0; s < 8; s++) {
          const stMesh = addMesh(templeGroup, stairGeo, matStone, false);
          stMesh.position.set(0, -0.04 - s * 0.17, 2.95 + s * 0.32);

          [-0.76, 0.76].forEach((sx) => {
            const sn = addMesh(templeGroup, stairSnowGeo, matSnow, false);
            sn.position.set(sx, 0.06 - s * 0.17, 2.95 + s * 0.32);
          });
        }

        // 台階兩側朱紅斜向扶手
        const slopeBarGeo = new THREE.BoxGeometry(0.11, 0.11, 2.95);
        const topRailGeo = new THREE.BoxGeometry(0.12, 0.09, 2.95);
        const stairPostGeo = new THREE.BoxGeometry(0.13, 0.72, 0.13);
        const stairCapGeo = new THREE.SphereGeometry(0.085, 8, 8);

        [-0.96, 0.96].forEach((rx) => {
          const slopeBar = addMesh(templeGroup, slopeBarGeo, matVermilion, false);
          slopeBar.position.set(rx, -0.15, 4.05);
          slopeBar.rotation.x = 0.48;

          const topRail = addMesh(templeGroup, topRailGeo, matVermilion, false);
          topRail.position.set(rx, 0.42, 4.05);
          topRail.rotation.x = 0.48;

          [2.85, 4.05, 5.25].forEach((pz, idx) => {
            const p = addMesh(templeGroup, stairPostGeo, matVermilion, false);
            p.position.set(rx, 0.32 - idx * 0.62, pz);
            const cap = addMesh(templeGroup, stairCapGeo, matGold, false);
            cap.position.set(rx, 0.72 - idx * 0.62, pz);
          });
        });

        // (B) 懸空木構舞台與高欄迴廊
        const mainDeck = addMesh(templeGroup, new THREE.BoxGeometry(6.5, 0.22, 5.3), matDarkRed, true);
        mainDeck.position.y = 0.14;

        const underPillarGeo = new THREE.CylinderGeometry(0.11, 0.12, 1.45, 8);
        for (let ix = -2; ix <= 2; ix++) {
          for (let iz = -2; iz <= 2; iz++) {
            if (Math.abs(ix) === 2 || iz === 2) {
              const pillar = addMesh(templeGroup, underPillarGeo, matDarkRed, false);
              pillar.position.set(ix * 1.45, -0.62, iz * 1.2);
            }
          }
        }
        const tieBeamGeo = new THREE.BoxGeometry(6.3, 0.1, 0.1);
        [-1.2, 1.2, 2.4].forEach((bz) => {
          const tie = addMesh(templeGroup, tieBeamGeo, matDarkRed, false);
          tie.position.set(0, -0.45, bz);
        });

        // 迴廊朱紅三層高欄
        (function buildDetailedVeranda() {
          const vGroup = new THREE.Group();
          vGroup.position.y = 0.25;
          const w = 6.3, d = 5.1;
          const railYs = [0.14, 0.44, 0.72];

          railYs.forEach((ry, idx) => {
            const thick = idx === 2 ? 0.085 : 0.065;
            const bBack = addMesh(vGroup, new THREE.BoxGeometry(w, thick, 0.09), matVermilion, false);
            bBack.position.set(0, ry, -d / 2);

            const bLeft = addMesh(vGroup, new THREE.BoxGeometry(0.09, thick, d), matVermilion, false);
            bLeft.position.set(-w / 2, ry, 0);

            const bRight = addMesh(vGroup, new THREE.BoxGeometry(0.09, thick, d), matVermilion, false);
            bRight.position.set(w / 2, ry, 0);

            const wingW = (w - 1.92) * 0.5;
            const wingGeo = new THREE.BoxGeometry(wingW, thick, 0.09);
            [-1, 1].forEach((dir) => {
              const bFront = addMesh(vGroup, wingGeo, matVermilion, false);
              bFront.position.set(dir * (0.96 + wingW * 0.5), ry, d / 2);
            });
          });

          const majorPostGeo = new THREE.BoxGeometry(0.14, 0.84, 0.14);
          const minorPostGeo = new THREE.BoxGeometry(0.11, 0.75, 0.11);
          const vOrbGeo = new THREE.SphereGeometry(0.085, 8, 8);

          const postCoords = [
            [-w / 2, d / 2, true], [w / 2, d / 2, true],
            [-w / 2, -d / 2, true], [w / 2, -d / 2, true],
            [-0.96, d / 2, true], [0.96, d / 2, true],
            [-2.1, d / 2, false], [2.1, d / 2, false],
            [-w / 2, 0, false], [w / 2, 0, false],
            [-w / 2, -1.3, false], [w / 2, -1.3, false],
            [-w / 2, 1.3, false], [w / 2, 1.3, false],
            [-1.55, -d / 2, false], [1.55, -d / 2, false]
          ];
          postCoords.forEach(([px, pz, isMajor]) => {
            const h = isMajor ? 0.84 : 0.75;
            const post = addMesh(vGroup, isMajor ? majorPostGeo : minorPostGeo, matVermilion, false);
            post.position.set(px, h * 0.5, pz);
            if (isMajor) {
              const orb = addMesh(vGroup, vOrbGeo, matGold, false);
              orb.scale.set(1, 1.25, 1);
              orb.position.set(px, h + 0.07, pz);
            }
          });

          templeGroup.add(vGroup);
        })();

        // (C) 一層本堂主殿：明亮米白和紙障子牆體 + 鮮明朱紅圓柱陣列 + 細密朱紅木格窗櫺 + 斗拱
        const firstHall = addMesh(templeGroup, new THREE.BoxGeometry(4.9, 2.45, 3.8), matShoji, true);
        firstHall.position.y = 1.48;

        const mainColGeo = new THREE.CylinderGeometry(0.13, 0.14, 2.52, 10);
        for (let ix = -2; ix <= 2; ix++) {
          [-1.92, 1.92].forEach((pz) => {
            const col = addMesh(templeGroup, mainColGeo, matVermilion, false);
            col.position.set(ix * 1.2, 1.5, pz);
          });
        }
        [-0.65, 0.65].forEach((pz) => {
          [-2.46, 2.46].forEach((px) => {
            const col = addMesh(templeGroup, mainColGeo, matVermilion, false);
            col.position.set(px, 1.5, pz);
          });
        });

        // 水平長押與頭貫木樑
        [0.84, 1.96, 2.42, 2.66].forEach((ly, idx) => {
          const extra = idx === 3 ? 0.36 : 0.12;
          const beam = addMesh(templeGroup, new THREE.BoxGeometry(5.05 + extra, 0.11, 3.92 + extra), matVermilion, false);
          beam.position.y = ly;
        });

        // 細密朱紅木格窗櫺（不加描邊網格，遠看極度俐落清晰）
        const vBarFrontGeo = new THREE.BoxGeometry(0.038, 1.48, 0.04);
        const hBarFrontGeo = new THREE.BoxGeometry(0.98, 0.038, 0.04);
        [-1.8, -0.6, 0.6, 1.8].forEach((wx) => {
          [-0.24, 0.24].forEach((subX) => {
            const vBar = addMesh(templeGroup, vBarFrontGeo, matVermilion, false);
            vBar.position.set(wx + subX, 1.52, 1.91);
          });
          [1.15, 1.52, 1.88].forEach((wy) => {
            const hBar = addMesh(templeGroup, hBarFrontGeo, matVermilion, false);
            hBar.position.set(wx, wy, 1.91);
          });
        });

        const vBarSideGeo = new THREE.BoxGeometry(0.04, 1.48, 0.038);
        const hBarSideGeo = new THREE.BoxGeometry(0.04, 0.038, 0.96);
        [-1.25, 0, 1.25].forEach((wz) => {
          [-2.46, 2.46].forEach((wx) => {
            [-0.22, 0.22].forEach((subZ) => {
              const svBar = addMesh(templeGroup, vBarSideGeo, matVermilion, false);
              svBar.position.set(wx, 1.52, wz + subZ);
            });
            [1.15, 1.52, 1.88].forEach((wy) => {
              const sBar = addMesh(templeGroup, hBarSideGeo, matVermilion, false);
              sBar.position.set(wx, wy, wz);
            });
          });
        });

        // 斗拱挑簷組物
        const bracketGeo = new THREE.BoxGeometry(0.32, 0.18, 0.36);
        for (let ix = -2; ix <= 2; ix++) {
          [-2.02, 2.02].forEach((pz) => {
            const bracket = addMesh(templeGroup, bracketGeo, matDarkRed, false);
            bracket.position.set(ix * 1.2, 2.62, pz);
          });
        }

        // (D) 輕薄俐落的入母屋造（Irimoya）飛簷屋頂 + 極薄一層初雪（slabThick = 0.13, thinSnow = 0.025）
        function createIrimoyaTempleRoof(width, depth, ridgeHeight, thinSnow = 0.025, withGable = true) {
          const segX = 28, segZ = 22;
          const slabThick = 0.13; // 纖薄屋瓦坡厚度，徹底杜絕厚重石板感
          const geo = new THREE.BoxGeometry(width, slabThick, depth, segX, 1, segZ);
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let y = pos.getY(i);
            let z = pos.getZ(i);
            const nx = Math.abs(x) / (width * 0.5);
            const nz = Math.abs(z) / (depth * 0.5);

            const slope = (1.0 - nz) * ridgeHeight;
            const cornerLift = Math.pow(nx, 2.3) * Math.pow(nz, 1.7) * 0.44;
            const eaveCurve = Math.pow(nz, 2.2) * 0.16;
            y += slope - eaveCurve + cornerLift;

            if (nz < 0.28) {
              x *= (1.0 - (0.28 - nz) * 0.34);
            }
            pos.setXYZ(i, x, y, z);
          }
          geo.computeVertexNormals();
          const roofGroup = new THREE.Group();
          // 屋頂本體保留外輪廓墨線
          addMesh(roofGroup, geo, matArchIndigo, true);

          // 屋簷下緣朱紅垂木椽條飾框
          const eaveTrim = addMesh(
            roofGroup,
            new THREE.BoxGeometry(width * 0.92, 0.06, depth * 0.92),
            matDarkRed,
            false
          );
          eaveTrim.position.y = -0.05;

          // 貼合屋坡的「薄薄一層」初雪（厚度僅 0.025，四周內縮露出深靛青瓦緣）
          const snowGeo = new THREE.PlaneGeometry(width * 0.955, depth * 0.955, segX, segZ);
          snowGeo.rotateX(-Math.PI / 2);
          const spos = snowGeo.attributes.position;
          for (let i = 0; i < spos.count; i++) {
            let x = spos.getX(i);
            let z = spos.getZ(i);
            const nx = Math.abs(x) / (width * 0.5);
            const nz = Math.abs(z) / (depth * 0.5);

            const slope = (1.0 - nz) * ridgeHeight;
            const cornerLift = Math.pow(nx, 2.3) * Math.pow(nz, 1.7) * 0.44;
            const eaveCurve = Math.pow(nz, 2.2) * 0.16;

            const edgeFade = Math.max(0, 1.0 - Math.pow(Math.max(nx, nz), 5.0));
            const y = (slabThick * 0.5) + slope - eaveCurve + cornerLift + thinSnow * (0.2 + 0.8 * edgeFade);

            if (nz < 0.28) {
              x *= (1.0 - (0.28 - nz) * 0.34);
            }
            spos.setXYZ(i, x, y, z);
          }
          snowGeo.computeVertexNormals();
          addMesh(roofGroup, snowGeo, matSnow, false);

          // 入母屋側面三角朱紅破風山牆
          if (withGable) {
            const gableSpan = depth * 0.42;
            const gableH = ridgeHeight * 0.85;
            const gShape = new THREE.Shape();
            gShape.moveTo(-gableSpan * 0.5, 0);
            gShape.lineTo(0, gableH);

        // 一層重簷大屋頂（輕薄瓦簷 + 0.024 薄雪）

        // 頂層大屋頂（輕薄瓦簷 + 0.026 薄雪）

        // (F) 正面唐破風（Karahafu）弧形玄關門廊（頂部僅極薄一層初雪 0.025 + 金色懸魚）

        const khShape = new THREE.Shape();

        // ==========================================
        // 4. 雲團狀浮世繪雪松 & 遠景珊瑚粉櫻林剪影
        // ==========================================
        function createUkiyoePine(x, y, z, scale, leanX = 0.25) {
          const tree = new THREE.Group();
          tree.position.set(x, y, z);
          tree.scale.setScalar(scale);

          const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(leanX * 0.8, 1.4, 0.15),
            new THREE.Vector3(-leanX * 0.4, 2.8, -0.1),
            new THREE.Vector3(leanX * 0.6, 4.1, 0.1)
          ]);
          const trunkGeo = new THREE.TubeGeometry(curve, 12, 0.22, 7, false);
          addMesh(tree, trunkGeo, matTrunk, true);

          const pads = [
            [leanX * 0.6, 4.3, 0.1, 2.3, 0.68, 1.9],
            [-0.95, 3.3, 0.4, 1.85, 0.58, 1.6],
            [1.15, 2.8, -0.2, 1.75, 0.55, 1.55],
            [-0.4, 2.1, 0.7, 1.5, 0.48, 1.35]
          ];
          pads.forEach(([px, py, pz, rx, ry, rz]) => {
            const g = new THREE.SphereGeometry(1, 12, 9);
            const p = g.attributes.position;
            for (let i = 0; i < p.count; i++) {
              let vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
              if (vy < 0) vy *= 0.35;
              const lobe = 1.0 + 0.18 * Math.sin(vx * 4.5 + vz * 4.5);
              p.setXYZ(i, vx * rx * lobe, vy * ry, vz * rz * lobe);
            }
            g.computeVertexNormals();
            const padMesh = addMesh(tree, g, matFoliage, true);
            padMesh.position.set(px, py, pz);
          });

          scene.add(tree);
          return tree;
        }

        // 左岸松林
        createUkiyoePine(-9.6, 1.2, 0.4, 1.25, 0.55);
        createUkiyoePine(-10.8, 2.2, -3.2, 1.45, 0.45);
        createUkiyoePine(-7.2, 1.8, -4.6, 1.15, 0.35);
        // 右後寺廟周邊古松（錯開位置，完全不遮擋朱紅古寺正面）
        createUkiyoePine(9.8, 4.4, -4.5, 1.42, -0.4);
        createUkiyoePine(1.0, 3.6, -5.8, 1.18, 0.25);
        createUkiyoePine(9.4, 2.0, 1.2, 1.05, -0.45);

        // 遠景珊瑚粉雲霞櫻樹剪影
        const matPinkSilhouette = new THREE.MeshBasicMaterial({
          color: 0xf4a598,
          transparent: true,
          opacity: 0.62
        });
        const pinkTrees = [
          [-11.5, 9.2, -16, 3.6],
          [-6.2, 10.8, -18, 4.2],
          [-1.2, 8.6, -15, 3.2],
          [2.8, 9.8, -17, 3.8],
          [-8.5, 6.8, -14, 2.8]
        ];
        pinkTrees.forEach(([px, py, pz, s]) => {
          const g = new THREE.Group();
          g.position.set(px, py, pz);
          for (let k = 0; k < 4; k++) {
            const dome = new THREE.SphereGeometry(s * (0.65 - k * 0.08), 10, 7);
            dome.scale(1.4, 0.38, 0.8);
            const m = new THREE.Mesh(dome, matPinkSilhouette);
            m.position.set((k - 1.5) * s * 0.45, -k * s * 0.28, k * 0.2);
            g.add(m);
          }
          scene.add(g);
        });

        // ==========================================
        // 5. 輕量化飄雪粒子系統
        // ==========================================
        const SNOW_COUNT = 420;
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = new Float32Array(SNOW_COUNT * 3);
        const snowVel = new Float32Array(SNOW_COUNT);
        for (let i = 0; i < SNOW_COUNT; i++) {
          snowPos[i * 3 + 0] = (Math.random() - 0.5) * 34;
          snowPos[i * 3 + 1] = Math.random() * 18;
          snowPos[i * 3 + 2] = (Math.random() - 0.5) * 28;
          snowVel[i] = 0.6 + Math.random() * 0.9;
        }
        snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));

        const snowCanvas = document.createElement("canvas");
        snowCanvas.width = 24;
        snowCanvas.height = 24;
        const sctx = snowCanvas.getContext("2d");
        const grad = sctx.createRadialGradient(12, 12, 1, 12, 12, 11);
        grad.addColorStop(0, "rgba(255,255,255,1)");
        grad.addColorStop(0.6, "rgba(240,248,255,0.85)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        sctx.fillStyle = grad;
        sctx.fillRect(0, 0, 24, 24);

        const snowMat = new THREE.PointsMaterial({
          size: 0.24,
          map: new THREE.CanvasTexture(snowCanvas),
          transparent: true,
          opacity: 0.9,
          depthWrite: false
        });
        const snowPoints = new THREE.Points(snowGeo, snowMat);
        scene.add(snowPoints);

        // ==========================================
        // 6. 觸控／滑鼠軌道相機控制器（直式手機螢幕雙主體完整同框取景）
        // ==========================================
        const isPortrait = window.innerHeight > window.innerWidth;
        const camPresets = {
          default: {
            pos: isPortrait ? new THREE.Vector3(-0.5, 9.0, 29.5) : new THREE.Vector3(-0.8, 6.8, 18.2),
            target: isPortrait ? new THREE.Vector3(0.1, 2.2, -0.2) : new THREE.Vector3(-0.2, 2.4, -0.4)
          },
          temple: {
            pos: new THREE.Vector3(0.4, 5.4, 8.2),
            target: new THREE.Vector3(4.55, 5.4, -2.55)
          },
          bridge: {
            pos: new THREE.Vector3(-3.6, 2.8, 10.6),
            target: new THREE.Vector3(-3.8, 1.3, 2.75)
          }
        };

        const ctrl = {
          target: camPresets.default.target.clone(),
          desiredTarget: camPresets.default.target.clone(),
          spherical: new THREE.Spherical(),
          desiredSpherical: new THREE.Spherical(),
          autoOrbit: false,
          isDragging: false,
          dragMode: "rotate",
          prevX: 0,
          prevY: 0,
          prevPinchDist: 0
        };

        function setCameraPreset(name) {
          if (name === "orbit") {
            ctrl.autoOrbit = true;
            return;
          }
          ctrl.autoOrbit = false;
          const p = camPresets[name] || camPresets.default;
          ctrl.desiredTarget.copy(p.target);
          const offset = new THREE.Vector3().subVectors(p.pos, p.target);
          ctrl.desiredSpherical.setFromVector3(offset);
        }

        setCameraPreset("default");
        ctrl.target.copy(ctrl.desiredTarget);
        ctrl.spherical.copy(ctrl.desiredSpherical);

        const domElem = renderer.domElement;

        domElem.addEventListener("mousedown", (e) => {
          ctrl.isDragging = true;
          ctrl.autoOrbit = false;
          ctrl.dragMode = e.button === 2 || e.shiftKey ? "pan" : "rotate";
          ctrl.prevX = e.clientX;
          ctrl.prevY = e.clientY;
        });

        window.addEventListener("mousemove", (e) => {
          if (!ctrl.isDragging) return;
          const dx = e.clientX - ctrl.prevX;
          const dy = e.clientY - ctrl.prevY;
          ctrl.prevX = e.clientX;
          ctrl.prevY = e.clientY;

          if (ctrl.dragMode === "rotate") {
            ctrl.desiredSpherical.theta -= dx * 0.0065;
            ctrl.desiredSpherical.phi = Math.max(0.18, Math.min(Math.PI * 0.48, ctrl.desiredSpherical.phi - dy * 0.0065));
          } else {
            panCamera(dx, dy);
          }
        });

        window.addEventListener("mouseup", () => {
          ctrl.isDragging = false;
        });

        domElem.addEventListener("contextmenu", (e) => e.preventDefault());

        domElem.addEventListener("wheel", (e) => {
          e.preventDefault();
          ctrl.autoOrbit = false;
          ctrl.desiredSpherical.radius = Math.max(5.5, Math.min(38, ctrl.desiredSpherical.radius * (1 + e.deltaY * 0.001)));
        }, { passive: false });

        domElem.addEventListener("touchstart", (e) => {
          ctrl.autoOrbit = false;
          if (e.touches.length === 1) {
            ctrl.isDragging = true;
            ctrl.dragMode = "rotate";
            ctrl.prevX = e.touches[0].clientX;
            ctrl.prevY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            ctrl.isDragging = true;
            ctrl.dragMode = "pinch";
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            ctrl.prevPinchDist = Math.hypot(dx, dy);
            ctrl.prevX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            ctrl.prevY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
          }
        }, { passive: true });

        domElem.addEventListener("touchmove", (e) => {
          if (!ctrl.isDragging) return;
          if (e.touches.length === 1 && ctrl.dragMode === "rotate") {
            const dx = e.touches[0].clientX - ctrl.prevX;
            const dy = e.touches[0].clientY - ctrl.prevY;
            ctrl.prevX = e.touches[0].clientX;
            ctrl.prevY = e.touches[0].clientY;
            ctrl.desiredSpherical.theta -= dx * 0.0075;
            ctrl.desiredSpherical.phi = Math.max(0.18, Math.min(Math.PI * 0.48, ctrl.desiredSpherical.phi - dy * 0.0075));
          } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            if (ctrl.prevPinchDist > 0) {
              const scale = ctrl.prevPinchDist / Math.max(10, dist);
              ctrl.desiredSpherical.radius = Math.max(5.5, Math.min(38, ctrl.desiredSpherical.radius * scale));
            }
            ctrl.prevPinchDist = dist;

            const cx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
            const cy = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
            panCamera(cx - ctrl.prevX, cy - ctrl.prevY);
            ctrl.prevX = cx;
            ctrl.prevY = cy;
          }
        }, { passive: true });

        domElem.addEventListener("touchend", () => {
          ctrl.isDragging = false;
          ctrl.prevPinchDist = 0;
        });

        function panCamera(dx, dy) {
          const factor = ctrl.desiredSpherical.radius * 0.0014;
          const right = new THREE.Vector3();
          const up = new THREE.Vector3(0, 1, 0);
          camera.getWorldDirection(right);
          right.cross(up).normalize();
          ctrl.desiredTarget.addScaledVector(right, -dx * factor);
          ctrl.desiredTarget.y = Math.max(-1, Math.min(10, ctrl.desiredTarget.y + dy * factor));
        }

        // ==========================================
        // 7. 控制面板互動綁定
        // ==========================================
        document.querySelectorAll("[data-cam]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-cam]").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            setCameraPreset(btn.dataset.cam);
          });
        });

        const palettes = {
          classic: {
            bg: 0xf7f2ea,
            ink: 0x1b3b5a,
            snow: 0xfcfdff,
            snowShadow: 0xc5d8ea,
            waterDeep: 0x164166,
            waterLight: 0x3f7ca6,
            vermilionBoost: 1.0
          },
          aizuri: {
            bg: 0xeef4fa,
            ink: 0x0f2c4a,
            snow: 0xf7fbff,
            snowShadow: 0x9fc0de,
            waterDeep: 0x0f3254,
            waterLight: 0x2d6899,
            vermilionBoost: 0.15
          },
          twilight: {
            bg: 0xf5e5dc,
            ink: 0x292542,
            snow: 0xfff5f0,
            snowShadow: 0xd1b8c8,
            waterDeep: 0x252d52,
            waterLight: 0x5c5885,
            vermilionBoost: 1.0
          }
        };

        document.querySelectorAll("[data-palette]").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll("[data-palette]").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const p = palettes[btn.dataset.palette];
            scene.background.setHex(p.bg);
            scene.fog.color.setHex(p.bg);
            globalUniforms.uInkColor.value.setHex(p.ink);
            globalUniforms.uSnowColor.value.setHex(p.snow);
            globalUniforms.uSnowShadow.value.setHex(p.snowShadow);
            globalUniforms.uWaterDeep.value.setHex(p.waterDeep);
            globalUniforms.uWaterLight.value.setHex(p.waterLight);
            globalUniforms.uVermilionBoost.value = p.vermilionBoost;
          });

        const sliderOutline = document.getElementById("slider-outline");
        const valOutline = document.getElementById("val-outline");
        sliderOutline.addEventListener("input", () => {
          const v = parseFloat(sliderOutline.value);
          valOutline.textContent = v.toFixed(1) + "x";
          globalUniforms.uOutlineWidth.value = 0.044 * v;
        });

        let activeSnowCount = Math.floor(0.65 * SNOW_COUNT);
        const sliderSnow = document.getElementById("slider-snow");
        const valSnow = document.getElementById("val-snow");
        sliderSnow.addEventListener("input", () => {
          const v = parseInt(sliderSnow.value, 10);
          valSnow.textContent = v + "%";
          activeSnowCount = Math.floor((v / 100) * SNOW_COUNT);
          snowGeo.setDrawRange(0, activeSnowCount);
        });
        snowGeo.setDrawRange(0, activeSnowCount);

        const sliderWater = document.getElementById("slider-water");
        const valWater = document.getElementById("val-water");
        sliderWater.addEventListener("input", () => {
          const v = parseFloat(sliderWater.value);
          valWater.textContent = v.toFixed(1) + "x";
          globalUniforms.uWaterSpeed.value = v;
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 立即隱藏載入畫面，進入互動渲染
        document.getElementById("loading-screen").classList.add("hidden");

        // ==========================================
        // 8. 高效能主動畫迴圈
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.getElapsedTime();
          globalUniforms.uTime.value = elapsed;

          if (ctrl.autoOrbit) {
            ctrl.desiredSpherical.theta += dt * 0.22;
          }

          ctrl.target.lerp(ctrl.desiredTarget, 0.12);
          ctrl.spherical.radius += (ctrl.desiredSpherical.radius - ctrl.spherical.radius) * 0.12;
          ctrl.spherical.phi += (ctrl.desiredSpherical.phi - ctrl.spherical.phi) * 0.12;
          ctrl.spherical.theta += (ctrl.desiredSpherical.theta - ctrl.spherical.theta) * 0.12;

          camera.position.setFromSpherical(ctrl.spherical).add(ctrl.target);
          camera.lookAt(ctrl.target);

          if (activeSnowCount > 0) {
            const posAttr = snowGeo.attributes.position;
            for (let i = 0; i < activeSnowCount; i++) {
              let y = posAttr.getY(i) - snowVel[i] * dt * 1.4;
              let x = posAttr.getX(i) + Math.sin(elapsed * 0.9 + i) * dt * 0.35;
              if (y < -0.5) {
                y = 17.5;
                x = (Math.random() - 0.5) * 34;
              }
              posAttr.setXY(i, x, y);
            }
            posAttr.needsUpdate = true;
          }

          renderer.render(scene, camera);
        }

        animate();
      }
    })();
  </script>
</body>
</html>
